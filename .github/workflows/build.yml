name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Ouvrir le bon zip
        run: |
          for z in ./*.zip; do
            if unzip -l "$z" | grep -q "ci/build-aar.sh"; then
              unzip -oq "$z"
            fi
          done
          ls MyVpn/ci
      - run: gradle assembleDebug --no-daemon
        working-directory: MyVpn
      - uses: actions/upload-artifact@v4
        with:
          name: MyVpn-apk
          path: MyVpn/app/build/outputs/apk/debug/*.apk
